<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Thông điệp ngày hôm nay ✦</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-light: #e8cc7a; --gold-dim: #6a5428;
            --ink: #080610; --mist: rgba(201,168,76,0.06);
            --card-bg: #120e1a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--ink); color:#cdbf9e;
            font-family:'EB Garamond',serif; min-height:100vh;
            display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
            justify-content: center;
        }
        
        /* Hiệu ứng sao lấp lánh nền */
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star { position:absolute; border-radius:50%; background:#fff; animation:twinkle var(--dur) ease-in-out infinite; }
        @keyframes twinkle { 0%,100%{opacity:.1} 50%{opacity:.7} }

        .wrapper { position:relative; z-index:1; width:100%; max-width:640px; padding:2rem 1.5rem; display:flex; flex-direction:column; align-items:center; gap:2.5rem; }
        header { text-align: center; }
        h1 { font-family:'Cinzel Decorative',cursive; font-size:clamp(1.8rem, 5vw, 2.5rem); color:var(--gold); text-shadow: 0 0 20px rgba(201,168,76,0.4); letter-spacing: 2px;}
        .hr { width: 80px; height: 1px; background: var(--gold-dim); margin: 15px auto; }
        
        /* Khu vực hiển thị lá bài */
        .stage { width:100%; display:flex; justify-content:center; perspective:1500px; min-height:450px; }
        .card-slot { position:relative; width:260px; height:430px; cursor: pointer; }
        
        .card-inner {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 16px;
            border: 2px solid var(--gold-dim); overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            background: var(--card-bg);
        }
        
        /* Mặt sau lá bài: Hoa văn nghệ thuật */
        .card-back { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-back svg { width: 100%; height: 100%; opacity: 0.6; }

        /* Mặt trước lá bài: Hình vẽ Vector */
        .card-front { transform: rotateY(180deg); display: flex; flex-direction: column; background: #0a0812; }
        .card-front svg { width: 100%; height: 100%; object-fit: contain;}
        .card-front.reversed { transform: rotateY(180deg) rotate(180deg); }

        /* Thông tin lá bài */
        .info { text-align:center; opacity:0; transform: translateY(20px); transition: 0.6s ease; margin-top: 1rem; }
        .info.show { opacity:1; transform: translateY(0); }
        .card-label { font-family:'Cinzel',serif; font-size:0.75rem; color:var(--gold-dim); letter-spacing: 3px; text-transform: uppercase;}
        .card-name { font-family:'Cinzel',serif; font-size:clamp(1.5rem, 4vw, 2rem); color:var(--gold-light); margin: 0.5rem 0; letter-spacing: 1px; }
        .meaning { font-style:italic; font-size:1.05rem; line-height:1.8; max-width: 480px; color: #b0a48e; margin: 0 auto; }

        /* Nút bấm */
        .btn {
            font-family:'Cinzel',serif; padding:1rem 3.5rem; border-radius:4px;
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            cursor:pointer; font-weight:bold; letter-spacing: 4px; text-transform: uppercase; font-size: 0.9rem;
            transition: 0.4s; position: relative; overflow: hidden; margin-top: 1rem;
        }
        .btn:hover { background: var(--gold); color: var(--ink); box-shadow: 0 0 30px rgba(201,168,76,0.5); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrapper">
    <header>
        <h1>Thông điệp ngày hôm nay</h1>
        <div class="hr"></div>
    </header>

    <div class="stage">
        <div class="card-slot" onclick="drawCard()">
            <div class="card-inner" id="cardInner">
                <div class="card-face card-back" id="backPattern">
                    </div>
                <div class="card-face card-front" id="cardFront">
                    </div>
            </div>
        </div>
    </div>

    <div class="info" id="info">
        <div id="cardStatus" class="card-label"></div>
        <div class="card-name" id="cardName"></div>
        <div class="meaning" id="cardMeaning"></div>
    </div>

    <button class="btn" onclick="drawCard()">Nhận thông điệp</button>
</div>

<script src="cards.js"></script>

<script>
    // --- KHỞI TẠO GIAO DIỆN ---
    
    // 1. Vẽ hoa văn mặt sau lá bài (SVG)
    const backSvg = `
        <svg viewBox="0 0 260 430" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="gradBack" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" stop-color="#1a1526" />
                    <stop offset="100%" stop-color="#0d0a14" />
                </radialGradient>
            </defs>
            <rect width="260" height="430" rx="16" fill="url(#gradBack)" stroke="#c9a84c" stroke-width="1"/>
            <circle cx="130" cy="215" r="80" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
            <circle cx="130" cy="215" r="40" stroke="#c9a84c" stroke-width="0.8"/>
            <path d="M130 30 V400 M30 215 H230" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
            <path d="M130 195 L150 215 L130 235 L110 215 Z" fill="#c9a84c" opacity="0.8"/>
            <circle cx="130" cy="215" r="5" fill="#e8cc7a"/>
            <g transform="translate(25, 25)" opacity="0.5"><circle r="2" fill="#c9a84c"/><path d="M0 0 L10 10 M0 0 L-10 -10" stroke="#c9a84c" stroke-width="0.5"/></g>
            <g transform="translate(235, 25)" opacity="0.5"><circle r="2" fill="#c9a84c"/><path d="M0 0 L-10 10 M0 0 L10 -10" stroke="#c9a84c" stroke-width="0.5"/></g>
            <g transform="translate(25, 405)" opacity="0.5"><circle r="2" fill="#c9a84c"/><path d="M0 0 L10 -10 M0 0 L-10 10" stroke="#c9a84c" stroke-width="0.5"/></g>
            <g transform="translate(235, 405)" opacity="0.5"><circle r="2" fill="#c9a84c"/><path d="M0 0 L-10 -10 M0 0 L10 10" stroke="#c9a84c" stroke-width="0.5"/></g>
        </svg>
    `;
    document.getElementById('backPattern').innerHTML = backSvg;

    // 2. Tạo hiệu ứng sao nền
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2 + 0.5;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
        starsContainer.appendChild(star);
    }

    // --- LOGIC RÚT BÀI ---
    
    let isDrawing = false; // Cờ chặn bấm liên tục

    function drawCard() {
        if (isDrawing) return;
        isDrawing = true;

        const cardInner = document.getElementById('cardInner');
        const cardFront = document.getElementById('cardFront');
        const info = document.getElementById('info');
        
        // 1. Úp bài cũ xuống, ẩn thông tin
        cardInner.classList.remove('flipped');
        info.classList.remove('show');

        // 2. Chờ hiệu ứng úp bài xong (0.4s) rồi mới đổi nội dung
        setTimeout(() => {
            // Kiểm tra xem file cards.js đã load chưa
            if (typeof CARDS === 'undefined' || CARDS.length === 0) {
                alert("Đang tải dữ liệu bài, vui lòng thử lại sau giây lát.");
                isDrawing = false;
                return;
            }

            // Chọn ngẫu nhiên một lá bài
            const card = CARDS[Math.floor(Math.random() * CARDS.length)];
            // Tỉ lệ 20% bài ngược
            const isReversed = Math.random() < 0.2; 

            // Cập nhật hình vẽ SVG
            cardFront.innerHTML = card.svg;
            // Cập nhật thông tin text
            document.getElementById('cardName').innerText = card.name;
            document.getElementById('cardMeaning').innerText = card.meaning;
            
            // Cập nhật trạng thái Xuôi/Ngược
            if (isReversed) {
                document.getElementById('cardStatus').innerText = "Thông điệp ngược";
                cardFront.classList.add('reversed');
            } else {
                document.getElementById('cardStatus').innerText = "Thông điệp xuôi";
                cardFront.classList.remove('reversed');
            }

            // 3. Lật bài lên
            cardInner.classList.add('flipped');
            
            // 4. Hiện thông tin trễ một chút (sau khi lật được một nửa)
            setTimeout(() => {
                info.classList.add('show');
                isDrawing = false; // Mở chặn
            }, 400);

        }, 400);
    }
</script>

</body>
</html>
