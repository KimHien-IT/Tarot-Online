<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Tarot Oracle ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
:root{--gold:#c9a84c;--gold-light:#e8cc7a;--gold-dim:#7a6230;--ink:#0a080f;--deep:#110d1a;--mid:#1c1628;--surface:#241e35;--mist:rgba(201,168,76,.08);--glow:rgba(201,168,76,.25)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--ink)}
body{color:#d4c5a9;font-family:'EB Garamond',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;cursor:default;perspective:1000px}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 15%,rgba(255,255,220,.7),transparent),radial-gradient(1px 1px at 25% 40%,rgba(255,255,220,.5),transparent),radial-gradient(1.5px 1.5px at 40% 8%,rgba(255,255,220,.8),transparent),radial-gradient(1px 1px at 55% 30%,rgba(255,255,220,.4),transparent),radial-gradient(1px 1px at 70% 20%,rgba(255,255,220,.6),transparent),radial-gradient(1.5px 1.5px at 85% 12%,rgba(255,255,220,.9),transparent),radial-gradient(1px 1px at 92% 45%,rgba(255,255,220,.5),transparent),radial-gradient(1px 1px at 15% 65%,rgba(255,255,220,.4),transparent),radial-gradient(1px 1px at 30% 80%,rgba(255,255,220,.6),transparent),radial-gradient(1.5px 1.5px at 60% 70%,rgba(255,255,220,.7),transparent),radial-gradient(1px 1px at 78% 85%,rgba(255,255,220,.5),transparent),radial-gradient(1px 1px at 5% 90%,rgba(255,255,220,.4),transparent),radial-gradient(1px 1px at 48% 55%,rgba(255,255,220,.3),transparent),radial-gradient(1.5px 1.5px at 95% 75%,rgba(255,255,220,.7),transparent),radial-gradient(1px 1px at 20% 95%,rgba(255,255,220,.5),transparent);pointer-events:none;z-index:1;animation:twinkle 6s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 50%,rgba(60,20,90,.35),transparent 60%),radial-gradient(ellipse 50% 60% at 80% 30%,rgba(20,40,90,.25),transparent 60%),radial-gradient(ellipse 40% 50% at 50% 90%,rgba(80,30,50,.2),transparent 60%);pointer-events:none;z-index:1}
@keyframes twinkle{from{opacity:.6}to{opacity:1}}

.game-world{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(to bottom,#070818 0%,#0d1028 35%,#17142d 65%,#09070f 100%);transition:transform .15s ease-out}
.game-world::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center 40%,transparent 20%,rgba(3,2,10,.35) 65%,rgba(0,0,0,.85) 100%);z-index:20}
.moon{position:absolute;width:190px;height:190px;top:9%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9dc,#e9dfb5 45%,#b6a97d 100%);box-shadow:0 0 25px rgba(255,240,180,.35),0 0 80px rgba(220,210,160,.18),0 0 150px rgba(180,170,120,.1);animation:moonFloat 8s ease-in-out infinite}
@keyframes moonFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
.moon-crater{position:absolute;border-radius:50%;background:rgba(120,110,80,.12)}
.crater-1{width:35px;height:35px;left:30px;top:50px}.crater-2{width:22px;height:22px;right:35px;top:85px}.crater-3{width:45px;height:25px;left:80px;bottom:30px}
.mountains{position:absolute;bottom:22%;left:-10%;width:120%;height:35%}
.mountains-back{opacity:.35;background:linear-gradient(135deg,transparent 48%,#121329 49%,#121329 65%,transparent 66%);clip-path:polygon(0 100%,8% 55%,18% 75%,29% 35%,40% 72%,52% 30%,63% 70%,76% 40%,87% 68%,100% 45%,100% 100%);animation:mountainMove 20s ease-in-out infinite alternate}
.mountains-front{bottom:14%;height:28%;opacity:.8;background:#090916;clip-path:polygon(0 100%,6% 70%,15% 82%,25% 50%,36% 76%,48% 42%,58% 78%,70% 52%,82% 75%,92% 45%,100% 68%,100% 100%)}
@keyframes mountainMove{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.mist{position:absolute;width:700px;height:130px;border-radius:50%;background:radial-gradient(ellipse,rgba(170,165,190,.13),transparent 70%);filter:blur(15px);opacity:.6}
.mist-1{bottom:25%;left:-300px;animation:mistMove1 25s linear infinite}.mist-2{bottom:35%;left:-500px;opacity:.35;animation:mistMove2 35s linear infinite}.mist-3{bottom:18%;left:-400px;opacity:.25;animation:mistMove1 40s linear infinite reverse}
@keyframes mistMove1{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 800px))}}@keyframes mistMove2{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 1000px))}}
.tree{position:absolute;bottom:8%;width:170px;height:420px;opacity:.9;background:linear-gradient(90deg,transparent 43%,#05040a 44%,#05040a 56%,transparent 57%)}
.tree::before,.tree::after{content:"";position:absolute;background:#05040a;transform-origin:bottom}.tree::before{width:130px;height:25px;bottom:250px;left:20px;transform:rotate(-28deg);box-shadow:50px -70px 0 #05040a,20px -130px 0 #05040a}.tree::after{width:120px;height:22px;bottom:180px;left:40px;transform:rotate(25deg);box-shadow:-20px -80px 0 #05040a,30px -150px 0 #05040a}
.tree-left{left:-90px;transform:scale(1.2)}.tree-right{right:-90px;transform:scaleX(-1) scale(1.2)}
.game-ground{position:absolute;bottom:0;left:0;width:100%;height:20%;background:linear-gradient(to top,#030207,rgba(5,4,12,.85),transparent)}
.fireflies{position:absolute;inset:0;z-index:5}.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#e8cc7a;box-shadow:0 0 6px #e8cc7a,0 0 15px rgba(232,204,122,.7);animation:fireflyFloat var(--duration) ease-in-out infinite,fireflyGlow 2s ease-in-out infinite alternate}
@keyframes fireflyFloat{0%,100%{translate:0 0}25%{translate:30px -40px}50%{translate:-20px -80px}75%{translate:40px -50px}}@keyframes fireflyGlow{from{opacity:.15;scale:.7}to{opacity:1;scale:1.4}}

.wrapper{position:relative;z-index:2;width:100%;max-width:680px;padding:3rem 1.5rem 5rem;display:flex;flex-direction:column;align-items:center;gap:2.5rem;transition:transform .2s ease-out}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem}.eye-symbol{width:52px;height:52px;opacity:.85}.site-title{font-family:'Cinzel Decorative',cursive;font-size:clamp(1.6rem,5vw,2.4rem);color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,.5),0 0 60px rgba(201,168,76,.2);letter-spacing:.12em;line-height:1.2}.site-subtitle{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-dim)}.divider{width:220px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:.2rem 0}
.card-stage{width:100%;display:flex;justify-content:center;align-items:center;min-height:380px;perspective:1200px}.card-slot{position:relative;width:240px;height:420px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
.card-placeholder{position:absolute;inset:0;border:1px dashed rgba(201,168,76,.2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:var(--mist);transition:opacity .5s}.card-placeholder.hidden{opacity:0;pointer-events:none}.placeholder-rune{font-size:2.5rem;opacity:.3;animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.placeholder-text{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-dim);text-align:center;line-height:1.7}
.card-flip-container{position:absolute;inset:0;transform-style:preserve-3d;opacity:0;transform:rotateY(90deg) scale(.8)}.card-flip-container.revealed{animation:cardReveal 1s cubic-bezier(.34,1.56,.64,1) forwards}.card-flip-container.revealed .card-img-wrap{animation:cardFloat 4s ease-in-out 1s infinite}
@keyframes cardReveal{0%{opacity:0;transform:rotateY(90deg) scale(.7) translateY(30px)}40%{opacity:1}100%{opacity:1;transform:rotateY(0) scale(1) translateY(0)}}@keyframes cardFloat{0%,100%{transform:translateY(0) rotateZ(0)}50%{transform:translateY(-8px) rotateZ(.5deg)}}
.card-img-wrap{position:absolute;inset:0;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(201,168,76,.3),0 0 25px rgba(201,168,76,.15),0 30px 60px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.04)}.card-img-wrap::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 50%);z-index:2;border-radius:12px;pointer-events:none}.card-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}.card-img.reversed{transform:rotate(180deg)}
.card-glow{position:absolute;inset:-20px;border-radius:20px;background:radial-gradient(ellipse at center,rgba(201,168,76,.35),rgba(120,80,180,.12) 35%,transparent 70%);filter:blur(5px);animation:pulseGlow 3s ease-in-out infinite;pointer-events:none}@keyframes pulseGlow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.particles{position:absolute;inset:0;pointer-events:none;overflow:visible}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-light);top:50%;left:50%;animation:particleBurst 1.2s ease-out forwards;opacity:0}@keyframes particleBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3);opacity:0}}
.card-info{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem;opacity:0;transform:translateY(16px);transition:opacity .6s .6s ease,transform .6s .6s ease}.card-info.visible{opacity:1;transform:translateY(0)}.card-name{font-family:'Cinzel',serif;font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:600;color:var(--gold-light);text-shadow:0 0 20px rgba(201,168,76,.4);letter-spacing:.05em}.card-number{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.3em;color:var(--gold-dim);text-transform:uppercase}.orientation-badge{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem 1rem;border-radius:20px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid;margin-top:.2rem}.orientation-badge.upright{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.35);color:var(--gold-light)}.orientation-badge.reversed{background:rgba(150,80,80,.15);border-color:rgba(180,80,80,.35);color:#e09090}.card-meaning{font-size:.9rem;font-style:italic;color:#9a8e7a;max-width:400px;line-height:1.7;padding:0 1rem}
.btn-wrap{position:relative;display:inline-block}.btn-draw{position:relative;font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);background:linear-gradient(135deg,var(--gold),var(--gold-light) 50%,var(--gold));border:none;padding:1rem 2.8rem;border-radius:4px;cursor:pointer;transition:transform .2s ease,box-shadow .3s ease;box-shadow:0 0 20px rgba(201,168,76,.3),0 4px 20px rgba(0,0,0,.5);overflow:hidden}.btn-draw::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.2) 50%,transparent);transform:translateX(-100%);transition:transform .4s ease}.btn-draw:hover::before{transform:translateX(100%)}.btn-draw:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 35px rgba(201,168,76,.5),0 8px 30px rgba(0,0,0,.6)}.btn-draw:active{transform:scale(.97)}.btn-draw.spinning{pointer-events:none;opacity:.7}.btn-icon{margin-right:.5rem}
.ornament{position:fixed;width:80px;height:80px;opacity:.18;z-index:10}.ornament-tl{top:16px;left:16px}.ornament-tr{top:16px;right:16px;transform:scaleX(-1)}.ornament-bl{bottom:16px;left:16px;transform:scaleY(-1)}.ornament-br{bottom:16px;right:16px;transform:scale(-1)}
.history-label{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);text-align:center}.history-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;max-width:500px}.history-card{width:44px;height:76px;border-radius:5px;overflow:hidden;border:1px solid rgba(201,168,76,.2);opacity:0;transform:translateY(10px) scale(.9);transition:opacity .4s ease,transform .4s ease,box-shadow .3s;cursor:pointer;flex-shrink:0}.history-card:hover{box-shadow:0 0 12px rgba(201,168,76,.35);transform:translateY(-4px) scale(1.05)}.history-card.show{opacity:.7;transform:translateY(0) scale(1)}.history-card img{width:100%;height:100%;object-fit:cover;display:block}.history-card.rev img{transform:rotate(180deg)}
footer{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(201,168,76,.2);text-align:center}
@media(max-width:600px){.moon{width:130px;height:130px;top:8%}.tree{opacity:.65;transform:scale(.75)}.tree-right{transform:scaleX(-1) scale(.75)}.wrapper{padding-top:2rem}.card-slot{width:210px;height:370px}.card-stage{min-height:340px}.site-subtitle{font-size:.65rem;letter-spacing:.22em}}
</style>
</head>

<body>
<div class="game-world">
  <div class="moon"><div class="moon-crater crater-1"></div><div class="moon-crater crater-2"></div><div class="moon-crater crater-3"></div></div>
  <div class="mountains mountains-back"></div><div class="mountains mountains-front"></div>
  <div class="mist mist-1"></div><div class="mist mist-2"></div><div class="mist mist-3"></div>
  <div class="fireflies" id="fireflies"></div>
  <div class="tree tree-left"></div><div class="tree tree-right"></div>
  <div class="game-ground"></div>
</div>

<svg class="ornament ornament-tl" viewBox="0 0 80 80" fill="none"><path d="M4 4 L4 40 L8 40 L8 8 L40 8 L40 4 Z" fill="#c9a84c"/><path d="M4 4 L20 20" stroke="#c9a84c"/><circle cx="4" cy="4" r="3" fill="#c9a84c"/></svg>
<svg class="ornament ornament-tr" viewBox="0 0 80 80" fill="none"><path d="M4 4 L4 40 L8 40 L8 8 L40 8 L40 4 Z" fill="#c9a84c"/><path d="M4 4 L20 20" stroke="#c9a84c"/><circle cx="4" cy="4" r="3" fill="#c9a84c"/></svg>
<svg class="ornament ornament-bl" viewBox="0 0 80 80" fill="none"><path d="M4 4 L4 40 L8 40 L8 8 L40 8 L40 4 Z" fill="#c9a84c"/><path d="M4 4 L20 20" stroke="#c9a84c"/><circle cx="4" cy="4" r="3" fill="#c9a84c"/></svg>
<svg class="ornament ornament-br" viewBox="0 0 80 80" fill="none"><path d="M4 4 L4 40 L8 40 L8 8 L40 8 L40 4 Z" fill="#c9a84c"/><path d="M4 4 L20 20" stroke="#c9a84c"/><circle cx="4" cy="4" r="3" fill="#c9a84c"/></svg>

<div class="wrapper">
<header>
<svg class="eye-symbol" viewBox="0 0 52 52" fill="none"><ellipse cx="26" cy="26" rx="22" ry="13" stroke="#c9a84c" stroke-width="1.2"/><circle cx="26" cy="26" r="7" stroke="#c9a84c" stroke-width="1.5"/><circle cx="26" cy="26" r="3" fill="#c9a84c"/><line x1="4" y1="26" x2="10" y2="26" stroke="#c9a84c"/><line x1="42" y1="26" x2="48" y2="26" stroke="#c9a84c"/><path d="M26 4 L26 10 M26 42 L26 48" stroke="#c9a84c"/></svg>
<div class="site-title">Tarot Oracle</div><div class="divider"></div><div class="site-subtitle">Bí ẩn của vũ trụ trong từng lá bài</div>
</header>

<div class="card-stage"><div class="card-slot">
<div class="card-placeholder" id="placeholder"><div class="placeholder-rune">✦</div><div class="placeholder-text">Tập trung tâm trí<br>rồi rút bài</div></div>
<div class="card-flip-container" id="cardFlip">
<div class="card-img-wrap"><img class="card-img" id="cardImg" src="" alt=""></div><div class="card-glow"></div><div class="particles" id="particles"></div>
</div></div></div>

<div class="card-info" id="cardInfo"><div class="card-number" id="cardNumber"></div><div class="card-name" id="cardName"></div><div class="orientation-badge" id="orientBadge"></div><div class="card-meaning" id="cardMeaning"></div></div>

<div class="btn-wrap"><button class="btn-draw" id="btnDraw" onclick="drawCard()"><span class="btn-icon">✦</span>Rút Bài</button></div>

</div>

<script>
const IMG_BASE='./tarot/card/';
const CARDS=[
['00_Fool','The Fool','Số 0 · Major Arcana','Khởi đầu mới, sự ngây thơ, tiềm năng vô hạn, hành trình mạo hiểm.'],
['01_Magician','The Magician','Số I · Major Arcana','Ý chí, sức mạnh, kỹ năng, khả năng biến ý tưởng thành hiện thực.'],
['02_High_Priestess','The High Priestess','Số II · Major Arcana','Trực giác, tri thức ẩn, sự thụ động, bí ẩn nội tâm.'],
['03_Empress','The Empress','Số III · Major Arcana','Sự phong nhiêu, sáng tạo, thiên nhiên, nuôi dưỡng và phong phú.'],
['04_Emperor','The Emperor','Số IV · Major Arcana','Quyền lực, trật tự, ổn định, nền tảng vững chắc.'],
['05_Hierophant','The Hierophant','Số V · Major Arcana','Truyền thống, tín ngưỡng, giáo huấn, quy ước xã hội.'],
['06_Lovers','The Lovers','Số VI · Major Arcana','Tình yêu, hài hòa, lựa chọn, sự hợp nhất của đối lập.'],
['07_Chariot','The Chariot','Số VII · Major Arcana','Chiến thắng, ý chí kiên định, kiểm soát bản thân, vượt qua thử thách.'],
['08_Strength','Strength','Số VIII · Major Arcana','Dũng cảm nội tâm, lòng kiên nhẫn, ảnh hưởng nhẹ nhàng mà mạnh mẽ.'],
['09_Hermit','The Hermit','Số IX · Major Arcana','Tìm kiếm nội tâm, cô đơn chữa lành, ánh sáng dẫn đường.'],
['10_Wheel_of_Fortune','Wheel of Fortune','Số X · Major Arcana','Vận mệnh, chu kỳ, bước ngoặt số phận, may rủi.'],
['11_Justice','Justice','Số XI · Major Arcana','Công bằng, sự thật, nguyên nhân và kết quả, cân bằng.'],
['12_Hanged_Man','The Hanged Man','Số XII · Major Arcana','Buông bỏ, hy sinh, quan điểm mới, chờ đợi.'],
['13_Death','Death','Số XIII · Major Arcana','Chuyển đổi, kết thúc và bắt đầu, sự thay đổi sâu sắc tất yếu.'],
['14_Temperance','Temperance','Số XIV · Major Arcana','Cân bằng, điều độ, kiên nhẫn, mục đích cao cả.'],
['15_Devil','The Devil','Số XV · Major Arcana','Ràng buộc, bóng tối, vật chất, những xiềng xích vô hình.'],
['16_Tower','The Tower','Số XVI · Major Arcana','Đột biến, sụp đổ bất ngờ, giải phóng khỏi ảo tưởng.'],
['17_Star','The Star','Số XVII · Major Arcana','Hy vọng, cảm hứng, thanh thản, niềm tin vào tương lai.'],
['18_Moon','The Moon','Số XVIII · Major Arcana','Ảo giác, vô thức, nỗi sợ hãi, sự mơ hồ khó đoán.'],
['19_Sun','The Sun','Số XIX · Major Arcana','Niềm vui, thành công, sự rõ ràng, sinh lực dồi dào.'],
['20_Judgement','Judgement','Số XX · Major Arcana','Thức tỉnh, suy nghĩ lại, tha thứ, lời kêu gọi số phận.'],
['21_World','The World','Số XXI · Major Arcana','Hoàn thành, tích hợp, viên mãn, sự trọn vẹn.'],
['Wands01','Ace of Wands','Ace · Wands','Nguồn cảm hứng mới, tiềm năng sáng tạo, khởi đầu đầy nhiệt huyết.'],
['Wands02','Two of Wands','Hai · Wands','Kế hoạch tương lai, dũng cảm bước ra khỏi vùng an toàn.'],
['Wands03','Three of Wands','Ba · Wands','Mở rộng tầm nhìn, cơ hội đang đến, tiến trình thuận lợi.'],
['Wands04','Four of Wands','Bốn · Wands','Lễ kỷ niệm, hòa hợp, sự ổn định nền tảng trong cộng đồng.'],
['Wands05','Five of Wands','Năm · Wands','Xung đột, cạnh tranh, bất đồng quan điểm.'],
['Wands06','Six of Wands','Sáu · Wands','Chiến thắng, được công nhận, tự tin tiến bước.'],
['Wands07','Seven of Wands','Bảy · Wands','Kiên trì giữ vững lập trường, bảo vệ những gì mình tin.'],
['Wands08','Eight of Wands','Tám · Wands','Tốc độ, hành động nhanh chóng, tin tức sắp tới.'],
['Wands09','Nine of Wands','Chín · Wands','Kiên cường, sức đề kháng, bảo vệ sau nhiều thử thách.'],

const history=[];

function spawnParticles(){
 const el=document.getElementById('particles'); el.innerHTML='';
 for(let i=0;i<18;i++){
  const p=document.createElement('div'); p.className='particle';
  const angle=i/18*2*Math.PI+Math.random()*.5, dist=80+Math.random()*80;
  p.style.setProperty('--tx',`${Math.cos(angle)*dist}px`);
  p.style.setProperty('--ty',`${Math.sin(angle)*dist}px`);
  p.style.animationDelay=`${Math.random()*.3}s`;
  p.style.width=`${2+Math.random()*4}px`; p.style.height=p.style.width;
  el.appendChild(p);
 }
}

function addToHistory(card,reversed,imgUrl){
 history.unshift({card,reversed,imgUrl}); if(history.length>7)history.pop();
 const row=document.getElementById('historyRow'),label=document.getElementById('histLabel');
 label.style.display='block'; row.innerHTML='';
 history.forEach((item,i)=>{
  const div=document.createElement('div'); div.className='history-card'+(item.reversed?' rev':'');
  const img=document.createElement('img'); img.src=item.imgUrl; img.alt=item.card.name;
  div.appendChild(img); row.appendChild(div);
  setTimeout(()=>div.classList.add('show'),i*60+100);
 });
}

function drawCard(){
 const btn=document.getElementById('btnDraw');
 btn.classList.add('spinning'); btn.textContent='⟳ Đang rút...';
 const card=CARDS[Math.floor(Math.random()*CARDS.length)];
 const reversed=Math.random()<.3, imgUrl=IMG_BASE+card.id+'.jpg';
 const flipEl=document.getElementById('cardFlip'),placeholder=document.getElementById('placeholder'),cardInfo=document.getElementById('cardInfo');
 flipEl.className='card-flip-container'; cardInfo.className='card-info';
 setTimeout(()=>{
  const img=document.getElementById('cardImg'); img.src=imgUrl; img.alt=card.name; img.className='card-img'+(reversed?' reversed':'');
  img.onerror=()=>console.warn('Không tìm thấy ảnh:',imgUrl);
  placeholder.classList.add('hidden'); flipEl.classList.add('revealed'); spawnParticles();
  setTimeout(()=>{
   document.getElementById('cardNumber').textContent=card.label;
   document.getElementById('cardName').textContent=card.name;
   const badge=document.getElementById('orientBadge'); badge.textContent=reversed?'↓ Ngược':'↑ Xuôi'; badge.className='orientation-badge '+(reversed?'reversed':'upright');
   document.getElementById('cardMeaning').textContent=card.meaning; cardInfo.classList.add('visible');
   addToHistory(card,reversed,imgUrl); btn.classList.remove('spinning'); btn.innerHTML='<span class="btn-icon">✦</span>Rút Bài Khác';
  },700);
 },200);
}

function createFireflies(){
 const container=document.getElementById('fireflies'); container.innerHTML='';
 const count=window.innerWidth<600?18:35;
 for(let i=0;i<count;i++){
  const f=document.createElement('div'); f.className='firefly';
  f.style.left=`${Math.random()*100}%`; f.style.top=`${35+Math.random()*55}%`;
  f.style.setProperty('--duration',`${6+Math.random()*8}s`);
  f.style.animationDelay=`${Math.random()*8}s`; container.appendChild(f);
 }
}
createFireflies();

let mx=0,my=0;
window.addEventListener('mousemove',e=>{
 mx=(e.clientX/window.innerWidth-.5); my=(e.clientY/window.innerHeight-.5);
 document.querySelector('.game-world').style.transform=`translate(${mx*-8}px,${my*-5}px) scale(1.02)`;
 document.querySelector('.wrapper').style.transform=`translate(${mx*4}px,${my*3}px)`;
});
window.addEventListener('mouseleave',()=>{
 document.querySelector('.game-world').style.transform='translate(0,0) scale(1)';
 document.querySelector('.wrapper').style.transform='translate(0,0)';
});
window.addEventListener('resize',createFireflies);
</script>
