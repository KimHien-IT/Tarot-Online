<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Tarot Oracle ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8cc7a;
    --gold-dim: #7a6230;
    --ink: #0a080f;
    --deep: #110d1a;
    --mid: #1c1628;
    --surface: #241e35;
    --mist: rgba(201,168,76,0.08);
    --glow: rgba(201,168,76,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: #d4c5a9;
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    cursor: default;
  }

  /* Star field */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,220,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,220,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,220,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 30%, rgba(255,255,220,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,220,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,220,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 45%, rgba(255,255,220,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 65%, rgba(255,255,220,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,220,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,220,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 85%, rgba(255,255,220,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 90%, rgba(255,255,220,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 48% 55%, rgba(255,255,220,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 95% 75%, rgba(255,255,220,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 95%, rgba(255,255,220,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* Nebula glow */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(60,20,90,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 30%, rgba(20,40,90,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 50% 90%, rgba(80,30,50,0.2) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 3rem 1.5rem 5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  /* Header */
  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }

  .eye-symbol {
    width: 52px;
    height: 52px;
    opacity: 0.85;
  }

  .site-title {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.5), 0 0 60px rgba(201,168,76,0.2);
    letter-spacing: 0.12em;
    line-height: 1.2;
  }

  .site-subtitle {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }

  .divider {
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 0.2rem 0;
  }

  /* Card stage */
  .card-stage {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 380px;
    perspective: 1200px;
  }

  .card-slot {
    position: relative;
    width: 240px;
    height: 420px;
  }

  /* Idle placeholder */
  .card-placeholder {
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(201,168,76,0.2);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: var(--mist);
    transition: opacity 0.5s;
  }

  .card-placeholder.hidden { opacity: 0; pointer-events: none; }

  .placeholder-rune {
    font-size: 2.5rem;
    opacity: 0.3;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .placeholder-text {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: center;
    line-height: 1.7;
  }

  /* The actual card */
  .card-flip-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    opacity: 0;
    transform: rotateY(90deg) scale(0.8);
    transition: none;
  }

  .card-flip-container.revealed {
    animation: cardReveal 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes cardReveal {
    0% {
      opacity: 0;
      transform: rotateY(90deg) scale(0.7) translateY(30px);
    }
    40% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: rotateY(0deg) scale(1) translateY(0);
    }
  }

  .card-img-wrap {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.3),
      0 0 25px rgba(201,168,76,0.15),
      0 30px 60px rgba(0,0,0,0.8),
      inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  .card-img-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
    z-index: 2;
    border-radius: 12px;
    pointer-events: none;
  }

  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 12px;
    transition: transform 0.3s ease;
  }

  .card-img.reversed {
    transform: rotate(180deg);
  }

  .card-glow {
    position: absolute;
    inset: -20px;
    border-radius: 20px;
    background: radial-gradient(ellipse at center, rgba(201,168,76,0.18) 0%, transparent 65%);
    animation: pulseGlow 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* Particle burst */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold-light);
    top: 50%;
    left: 50%;
    animation: particleBurst 1.2s ease-out forwards;
    opacity: 0;
  }

  @keyframes particleBurst {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.3); opacity: 0; }
  }

  /* Card info */
  .card-info {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s 0.6s ease, transform 0.6s 0.6s ease;
  }

  .card-info.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    font-weight: 600;
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(201,168,76,0.4);
    letter-spacing: 0.05em;
  }

  .card-number {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  .orientation-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 1rem;
    border-radius: 20px;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid;
    margin-top: 0.2rem;
  }

  .orientation-badge.upright {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.35);
    color: var(--gold-light);
  }

  .orientation-badge.reversed {
    background: rgba(150,80,80,0.15);
    border-color: rgba(180,80,80,0.35);
    color: #e09090;
  }

  .card-meaning {
    font-size: 0.9rem;
    font-style: italic;
    color: #9a8e7a;
    max-width: 400px;
    line-height: 1.7;
    padding: 0 1rem;
  }

  /* Draw button */
  .btn-wrap {
    position: relative;
    display: inline-block;
  }

  .btn-draw {
    position: relative;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    border: none;
    padding: 1rem 2.8rem;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.3s;
    box-shadow: 0 0 20px rgba(201,168,76,0.3), 0 4px 20px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .btn-draw::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }

  .btn-draw:hover::before { transform: translateX(100%); }

  .btn-draw:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 35px rgba(201,168,76,0.5), 0 8px 30px rgba(0,0,0,0.6);
  }

  .btn-draw:active { transform: scale(0.97) translateY(0); }

  .btn-draw.spinning {
    pointer-events: none;
    opacity: 0.7;
  }

  .btn-icon { margin-right: 0.5rem; }

  /* Corner ornaments */
  .ornament {
    position: fixed;
    width: 80px;
    height: 80px;
    opacity: 0.18;
  }
  .ornament-tl { top: 16px; left: 16px; }
  .ornament-tr { top: 16px; right: 16px; transform: scaleX(-1); }
  .ornament-bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
  .ornament-br { bottom: 16px; right: 16px; transform: scale(-1); }

  /* Spread history row */
  .history-label {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: center;
  }

  .history-row {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 500px;
  }

  .history-card {
    width: 44px;
    height: 76px;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.2);
    opacity: 0;
    transform: translateY(10px) scale(0.9);
    transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s;
    cursor: pointer;
    flex-shrink: 0;
  }

  .history-card:hover {
    box-shadow: 0 0 12px rgba(201,168,76,0.35);
    transform: translateY(-4px) scale(1.05);
  }

  .history-card.show {
    opacity: 0.7;
    transform: translateY(0) scale(1);
  }

  .history-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .history-card.rev img { transform: rotate(180deg); }

  footer {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.2);
    text-align: center;
  }
</style>
</head>

const IMG_BASE = 'https://www.sacred-texts.com/tarot/pkt/img/';
const history = [];

function spawnParticles() {
  const el = document.getElementById('particles');
  el.innerHTML = '';
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / count) * 2 * Math.PI + Math.random() * 0.5;
    const dist = 80 + Math.random() * 80;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    p.style.setProperty('--tx', `${tx}px`);
    p.style.setProperty('--ty', `${ty}px`);
    p.style.animationDelay = `${Math.random() * 0.3}s`;
    p.style.width = `${2 + Math.random() * 4}px`;
    p.style.height = p.style.width;
    p.style.opacity = `${0.5 + Math.random() * 0.5}`;
    el.appendChild(p);
  }
}

function addToHistory(card, reversed, imgUrl) {
  history.unshift({ card, reversed, imgUrl });
  if (history.length > 7) history.pop();

  const row = document.getElementById('historyRow');
  const label = document.getElementById('histLabel');
  label.style.display = 'block';
  row.innerHTML = '';

  history.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'history-card' + (item.reversed ? ' rev' : '');
    const img = document.createElement('img');
    img.src = item.imgUrl;
    img.alt = item.card.name;
    div.appendChild(img);
    row.appendChild(div);
    setTimeout(() => div.classList.add('show'), i * 60 + 100);
  });
}

function drawCard() {
  const btn = document.getElementById('btnDraw');
  btn.classList.add('spinning');
  btn.textContent = '⟳ Đang rút...';

  const idx = Math.floor(Math.random() * CARDS.length);
  const card = CARDS[idx];
  const reversed = Math.random() < 0.3;
  const imgUrl = IMG_BASE + card.id + '.jpg';

  // Reset flip container
  const flipEl = document.getElementById('cardFlip');
  const placeholder = document.getElementById('placeholder');
  const cardInfo = document.getElementById('cardInfo');

  flipEl.className = 'card-flip-container';
  cardInfo.className = 'card-info';

  setTimeout(() => {
    // Update image
    const imgEl = document.getElementById('cardImg');
    imgEl.src = imgUrl;
    imgEl.alt = card.name;
    imgEl.className = 'card-img' + (reversed ? ' reversed' : '');

    // Trigger animation
    placeholder.classList.add('hidden');
    flipEl.classList.add('revealed');

    // Particles
    spawnParticles();

    // Show info
    setTimeout(() => {
      document.getElementById('cardNumber').textContent = card.label;
      document.getElementById('cardName').textContent = card.name;
      const badge = document.getElementById('orientBadge');
      badge.textContent = reversed ? '↓ Ngược' : '↑ Xuôi';
      badge.className = 'orientation-badge ' + (reversed ? 'reversed' : 'upright');
      document.getElementById('cardMeaning').textContent = card.meaning;
      cardInfo.classList.add('visible');

      // History
      addToHistory(card, reversed, imgUrl);

      // Re-enable button
      btn.classList.remove('spinning');
      btn.innerHTML = '<span class="btn-icon">✦</span>Rút Bài Khác';
    }, 700);

  }, 200);
}
